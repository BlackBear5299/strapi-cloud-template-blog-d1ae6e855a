name: Deploy backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Stop on the first error so a failed build never reaches pm2 restart.
            # Plain `set -e` (no pipefail): the login shell may be dash.
            set -e
            cd /var/www/backend
            git pull origin main
            npm install
            npm run build
            pm2 restart moms-website-backend
